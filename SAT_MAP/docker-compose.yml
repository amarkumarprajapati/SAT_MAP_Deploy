name: sat_map_frontend

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sat_map_frontend
    ports:
      - "${FRONTEND_PORT:-7890}:7890"
    environment:
      - NODE_ENV=development
      - PORT=7890
      - HOSTNAME=0.0.0.0
      - FASTAPI_URL=${FASTAPI_URL:-http://host.docker.internal:8569}
      # Critical for Windows Docker Desktop file watching and instant hot reload:
      - WATCHPACK_POLLING=true
      - WATCHPACK_POLLING_INTERVAL=3000
    volumes:
      # Mount workspace code into the container for instant hot-reloading
      - ./:/app
      # Preserve container node_modules & Next.js cache so host doesn't overwrite them
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
